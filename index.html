<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>3D Portfolio - Interactive n8n Workflow Experience</title>
    <meta name="title" content="3D Portfolio - Interactive n8n Workflow Experience" />
    <meta name="description" content="Explore my portfolio through an interactive 3D n8n workflow visualization. Navigate animated nodes, view projects, skills, and experience in a unique immersive environment built with Three.js and React." />
    <meta name="keywords" content="3D portfolio, interactive portfolio, n8n workflow, Three.js, React, web developer, creative portfolio, 3D visualization" />
    <meta name="author" content="Your Name" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://yourportfolio.com/" />
    <meta property="og:title" content="3D Portfolio - Interactive n8n Workflow Experience" />
    <meta property="og:description" content="Explore my portfolio through an interactive 3D n8n workflow visualization. Navigate animated nodes, view projects, skills, and experience in a unique immersive environment." />
    <meta property="og:image" content="https://yourportfolio.com/og-image.jpg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://yourportfolio.com/" />
    <meta property="twitter:title" content="3D Portfolio - Interactive n8n Workflow Experience" />
    <meta property="twitter:description" content="Explore my portfolio through an interactive 3D n8n workflow visualization built with Three.js and React." />
    <meta property="twitter:image" content="https://yourportfolio.com/twitter-image.jpg" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#7B3FF2" />
    <meta name="msapplication-TileColor" content="#7B3FF2" />

    <!-- Preconnect to improve performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Schema.org JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Your Name",
      "url": "https://yourportfolio.com",
      "jobTitle": "Full Stack Developer",
      "description": "Interactive 3D portfolio showcasing web development projects and skills",
      "sameAs": [
        "https://github.com/yourusername",
        "https://linkedin.com/in/yourusername",
        "https://twitter.com/yourusername"
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
